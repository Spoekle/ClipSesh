services:
  mongo:
    image: mongo:7
    container_name: clipsesh-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo:/dump
    networks:
      - clipsesh-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: clipsesh-app:latest
    container_name: clipsesh-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - MONGODB_URI=mongodb://mongo:27017/clipsesh
      - VIRTUAL_HOST=${VIRTUAL_HOST:-clipsesh.spoekle.com,api.spoekle.com}
      - LETSENCRYPT_HOST=${VIRTUAL_HOST:-clipsesh.spoekle.com,api.spoekle.com}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./uploads:/app/uploads
      - ./profilePictures:/app/profilePictures
      - ./download:/app/download
    networks:
      - clipsesh-network

volumes:
  mongo-data:

networks:
  clipsesh-network:
    driver: bridge
