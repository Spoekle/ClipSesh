services:
  postgres:
    image: postgres:18
    container_name: clipsesh-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=clipsesh
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=clipsesh
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipsesh -d clipsesh"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - clipsesh-network

  # Only needed as the source for the one-time `npm run db:migrate-mongo`.
  mongo:
    image: mongo:latest
    container_name: clipsesh-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo:/dump
    networks:
      - clipsesh-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipsesh-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgres://clipsesh:${POSTGRES_PASSWORD}@postgres:5432/clipsesh
    env_file:
      - path: .env
        required: false
    volumes:
      - ./uploads:/app/uploads
      - ./profilePictures:/app/profilePictures
      - ./download:/app/download
    networks:
      - clipsesh-network

volumes:
  postgres-data:
  mongo-data:

networks:
  clipsesh-network:
    driver: bridge
