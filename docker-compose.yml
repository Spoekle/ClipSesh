services:
  mongo:
    image: mongo:latest
    container_name: clipsesh-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo:/dump
    networks:
      - clipsesh-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipsesh-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - MONGODB_URI=mongodb://192.168.1.38:27017/clipsesh
    env_file:
      - path: .env
        required: false
    volumes:
      - ./uploads:/app/uploads
      - ./profilePictures:/app/profilePictures
      - ./download:/app/download
    networks:
      - clipsesh-network

volumes:
  mongo-data:

networks:
  clipsesh-network:
    driver: bridge
