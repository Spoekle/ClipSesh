services:
  postgres:
    image: postgres:18
    container_name: clipsesh-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=clipsesh
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=clipsesh
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipsesh -d clipsesh"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - clipsesh-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipsesh-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgres://clipsesh:${POSTGRES_PASSWORD}@postgres:5432/clipsesh
      - FRONTEND_URL=${FRONTEND_URL}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - CC_CLIENT_ID=${CC_CLIENT_ID:-}
      - CC_CLIENT_SECRET=${CC_CLIENT_SECRET:-}
      - CC_BASE_URL=${CC_BASE_URL:-https://cube.community}
      - MAIL_EMAIL=${MAIL_EMAIL:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-}
      - MAIL_FROM=${MAIL_FROM:-}
    volumes:
      - uploads:/app/uploads
      - profile-pictures:/app/profilePictures
      - download:/app/download
    networks:
      - clipsesh-network

volumes:
  postgres-data:
  uploads:
  profile-pictures:
  download:

networks:
  clipsesh-network:
    driver: bridge
